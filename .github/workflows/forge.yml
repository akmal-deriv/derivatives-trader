name: Forge — issue to PR

# Add the `forge` label to an issue and this opens a PR that closes it.
#
# Engine: deriv-com/spec-to-pr. It classifies the issue (bugfix | feature |
# refactor) itself, writes a design doc and a plan, implements them, verifies
# the result, and opens the PR — all committed so the "why" travels with the
# change.
#
# Auth is PAT-free: two GitHub App installation tokens — the *_WRITE app for
# this repo (labels, branch, PR) and the read-only app for the engine.
#
# Verify commands live in spec-to-pr.config.json (not auto-detected: the default
# `npm test` runs stylelint + eslint + jest across every workspace, which does
# not fit the token lifetime).

on:
  issues:
    types: [labeled]

jobs:
  forge:
    if: github.event.label.name == 'forge'

    # The LiteLLM gateway sits behind a Cloudflare WAF that challenges generic
    # GitHub-hosted IPs — on ubuntu-latest the agent fails with
    # "Failed to authenticate. API Error: Attention Required! | Cloudflare"
    # before the key is even checked. This runner group is the one deriv-com's
    # claude-pr-review.yml / ai-pr-review.yml use, i.e. the allowlisted path.
    #
    # NOTE: spec-to-pr gives the agent unrestricted shell whenever
    # GITHUB_ACTIONS=true, which assumes a disposable machine. That is fine if
    # this group is GitHub-hosted (ephemeral). If it is backed by persistent
    # self-hosted runners, force least-privilege mode instead.
    runs-on:
      group: github_claude_code_reviewer

    # App installation tokens expire after 1 hour. Stay inside that window so
    # the final push and PR creation can still authenticate.
    timeout-minutes: 55

    concurrency:
      group: forge-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      issues: write

    steps:
      # ---- token --------------------------------------------------------
      - name: Mint token for this repo (labels, comments, branch, PR)
        id: repo-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CLIENT_ID_GHAPP_WRITE }}
          private-key: ${{ secrets.PRIVATE_KEY_GHAPP_WRITE }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # ---- authorize ----------------------------------------------------
      - name: Verify the labeller is a collaborator
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}" --silent 2>/dev/null; then
            echo "::error::${ACTOR} is not a collaborator on ${GITHUB_REPOSITORY} — refusing to run."
            exit 1
          fi
          echo "Authorized: ${ACTOR}"

      # Minted only after authorization, so an unauthorized label costs nothing.
      - name: Mint token to read the spec-to-pr engine
        id: engine-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CLIENT_ID_GHAPP }}
          private-key: ${{ secrets.PRIVATE_KEY_GHAPP }}
          owner: deriv-com
          repositories: spec-to-pr
          permission-contents: read

      # ---- claim the issue ----------------------------------------------
      - name: Claim the issue
        id: claim
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Consume the trigger label so re-applying it re-runs Forge.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label "forge" --add-label "forge:running"
          URL=$(gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "🔨 **Forge** picked this up — [watch the run]($RUN_URL).")
          # .../issues/12#issuecomment-345 -> 345, so we can edit this comment later.
          echo "comment_id=${URL##*issuecomment-}" >> "$GITHUB_OUTPUT"

      # ---- workspace -----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.repo-token.outputs.token }}
          fetch-depth: 0 # spec-to-pr diffs against the base branch

      - name: Setup Node
        uses: ./.github/actions/setup_node

      - name: Fetch the spec-to-pr engine
        # Fetched into RUNNER_TEMP, not the workspace, so the agent can never see
        # or commit the engine's own files.
        #
        # ENGINE_REF is an immutable commit SHA, not a branch: this job runs the
        # engine with a write token in scope, so tracking `master` would let any
        # push to that repo execute here. Bump this deliberately.
        env:
          ENGINE_TOKEN: ${{ steps.engine-token.outputs.token }}
          ENGINE_REF: 6223a741f025066119e16029a50390f468d7d459 # deriv-com/spec-to-pr master, 2026-08-07
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/forge-engine"
          # `git clone --branch` only accepts branch/tag names, so fetch the SHA
          # explicitly. Works for a tag name too if you switch to releases later.
          git init -q "$DIR"
          git -C "$DIR" remote add origin \
            "https://x-access-token:${ENGINE_TOKEN}@github.com/deriv-com/spec-to-pr.git"
          git -C "$DIR" fetch -q --depth 1 origin "$ENGINE_REF"
          git -C "$DIR" checkout -q --detach FETCH_HEAD
          # Drop the embedded credential; it isn't needed past the fetch.
          git -C "$DIR" remote set-url origin "https://github.com/deriv-com/spec-to-pr.git"
          echo "Engine at $(git -C "$DIR" rev-parse HEAD)"
          # The engine has its own dependency tree; install it in its own dir so
          # it never mixes with this repo's workspaces. Keep optional deps: the
          # claude-code native binary ships as a platform-specific optional
          # dependency (@anthropic-ai/claude-code-linux-x64 on this runner).
          ( cd "$DIR" && npm ci --omit=dev --include=optional )

          # @anthropic-ai/claude-code ships bin/claude.exe as a small JS placeholder;
          # its postinstall (`node install.cjs`) copies the real native binary over
          # it. If the runner disables install scripts (e.g. an org-wide
          # `ignore-scripts` in .npmrc), that never runs — so the engine ends up
          # exec'ing a JS stub named `.exe` and Node dies with "Unknown file
          # extension .exe". Run the installer ourselves (invoking it directly
          # bypasses ignore-scripts), then fail loudly if the result still isn't a
          # native binary, instead of the cryptic error surfacing mid-run.
          ( cd "$DIR" && node node_modules/@anthropic-ai/claude-code/install.cjs )
          # Resolve the bin path the same way the engine (and the preflight below)
          # do, so this check can't drift from a future change to the package's
          # `bin` field/filename.
          CLAUDE_BIN=$(cd "$DIR" && node -e "
            const path = require('path');
            const pkg = require('@anthropic-ai/claude-code/package.json');
            const dir = path.dirname(require.resolve('@anthropic-ai/claude-code/package.json'));
            console.log(path.join(dir, typeof pkg.bin === 'string' ? pkg.bin : pkg.bin.claude));
          ")
          CLAUDE_FILE=$(file -b "$CLAUDE_BIN")
          # Match ELF specifically (the runner is ubuntu-latest). NOT 'executable':
          # `file` labels a shebang'd script "... script text executable, ASCII text",
          # which would false-pass the very JS placeholder this guard exists to catch.
          if [[ "$CLAUDE_FILE" != *ELF* ]]; then
            echo "::error::claude-code native binary was not materialized — $CLAUDE_BIN is not a native executable: $CLAUDE_FILE"
            exit 1
          fi
          echo "claude binary ok: $CLAUDE_FILE"

          echo "FORGE_CLI=$DIR/bin/cli.js" >> "$GITHUB_ENV"

      - name: Resolve the LLM gateway
        # Deriv serves Claude through a LiteLLM gateway, not a direct Anthropic
        # key — a raw ANTHROPIC_API_KEY here fails with "Invalid API key".
        #
        # The trailing /v1 MUST be stripped: Claude Code appends /v1/messages
        # itself, so passing .../v1 yields .../v1/v1/messages. deriv-com's
        # shared ai_review_engine_anthropic action takes the same caller-facing
        # ".../v1" value and strips it the same way before export.
        env:
          RAW_BASE_URL: ${{ secrets.LITELLM_API_URL || 'https://litellmsa.deriv.ai/v1' }}
        run: |
          set -euo pipefail
          BASE="${RAW_BASE_URL%/}"
          BASE="${BASE%/v1}"
          echo "ANTHROPIC_BASE_URL=$BASE" >> "$GITHUB_ENV"
          # Model is optional per the engine README, but must be an alias the
          # gateway fronts. claude-sonnet-5 is the default the shared AI review
          # workflow uses against this same proxy.
          echo "ANTHROPIC_MODEL=claude-sonnet-5" >> "$GITHUB_ENV"

          # Claude Code also makes background calls with a small/fast model. The
          # engine only sets ANTHROPIC_SMALL_FAST_MODEL for the `glm` agent, so on
          # the default `claude` agent it would ask the gateway for a model the
          # proxy may not front. deriv-com's ai_review_engine_anthropic sets these
          # same three flags against this same gateway for that reason.
          {
            echo "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1"
            echo "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1"
            echo "DISABLE_NON_ESSENTIAL_MODEL_CALLS=1"
          } >> "$GITHUB_ENV"

          echo "gateway: $BASE | model: claude-sonnet-5"

      - name: Preflight — can the agent reach the API?
        # `dstp check` is NOT enough here: it only tests that ANTHROPIC_API_KEY is
        # *present* and that the claude binary resolves (preflight.js) — it never
        # calls the API, so an invalid key or an inaccessible model still passes.
        #
        # And the engine's own classify step runs claude with --output-format text
        # then DISCARDS stdout on a non-zero exit, so the real error is lost and
        # you only see "claude exited with code 1".
        #
        # So: invoke claude directly and print everything. Runs before the repo's
        # dependency install so auth failures surface in ~1 min, not ~10.
        env:
          # Gateway auth. ANTHROPIC_API_KEY is deliberately NOT set: it takes
          # precedence over the gateway path, and the key in this repo is not a
          # direct Anthropic key ("Invalid API key").
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -uo pipefail
          echo "base_url: ${ANTHROPIC_BASE_URL:-<unset>} | model: ${ANTHROPIC_MODEL:-<unset>}"
          cd "$RUNNER_TEMP/forge-engine"
          BIN=$(node -e "
            const path = require('path');
            const pkg = require('@anthropic-ai/claude-code/package.json');
            const dir = path.dirname(require.resolve('@anthropic-ai/claude-code/package.json'));
            console.log(path.join(dir, typeof pkg.bin === 'string' ? pkg.bin : pkg.bin.claude));
          ")
          echo "claude binary: $BIN"
          # claude.exe is a native executable — run it DIRECTLY (this is how the
          # engine spawns it). `node "$BIN"` would fail with ERR_UNKNOWN_FILE_EXTENSION
          # because Node can't load a native binary (or a .exe-named JS stub) as a module.
          echo "Reply with exactly: OK" | "$BIN" -p --output-format text \
            --dangerously-skip-permissions; STATUS=$?
          echo "claude exit status: ${STATUS:-0}"
          [ "${STATUS:-0}" -eq 0 ] || echo "::error::claude could not run — see the output above (usually an invalid ANTHROPIC_API_KEY or a model the key cannot access)."
          exit "${STATUS:-0}"

      - name: Install dependencies
        # Same path as Test & Validate, so the agent sees the tree CI sees.
        # After the preflight: this is the slowest step, and there's no point
        # paying for it if the agent can't authenticate.
        uses: ./.github/actions/npm_install_from_cache

      # ---- run ------------------------------------------------------------
      - name: Run Forge
        id: forge
        env:
          # ANTHROPIC_BASE_URL and ANTHROPIC_MODEL come from the "Resolve the LLM
          # gateway" step via $GITHUB_ENV. ANTHROPIC_API_KEY is deliberately unset
          # so it can't take precedence over the gateway.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_API_KEY }}
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.repo-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -o pipefail
          git config --global user.name  "forge[bot]"
          git config --global user.email "forge@users.noreply.github.com"

          # `|| STATUS=$?` keeps the default `bash -e` from aborting before we
          # can salvage the result line and surface the log.
          node "$FORGE_CLI" auto "$ISSUE_URL" --cwd . --unattended --json 2>&1 | tee /tmp/forge.log || STATUS=$?
          STATUS=${STATUS:-0}

          # --json writes the result as a single JSON line on stdout.
          RESULT=$(grep -oE '^\{.*\}$' /tmp/forge.log | tail -1 || true)
          if [ -n "$RESULT" ]; then
            echo "pr_url=$(printf '%s' "$RESULT" | jq -r '.pr_url // empty')" >> "$GITHUB_OUTPUT"
          fi
          exit $STATUS

      # ---- report ---------------------------------------------------------
      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ steps.claim.outputs.comment_id }}
          PR_URL: ${{ steps.forge.outputs.pr_url }}
          OUTCOME: ${{ steps.forge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ "$OUTCOME" = "success" ] && [ -n "${PR_URL:-}" ]; then
            BODY=$(printf '🔨 **Forge** opened %s\n\nThe design doc and implementation plan are committed in the PR.' "$PR_URL")
            LABEL="forge:done"
          else
            # The log is the agent's combined stdout/stderr, so scrub anything
            # token-shaped before it lands in an issue comment. Defence in depth:
            # Actions already masks registered secrets, but tokens minted at run
            # time (and anything the agent echoes) are not registered.
            TAIL=$(tail -c 3000 /tmp/forge.log 2>/dev/null | sed -E \
              -e 's/gh[pousr]_[A-Za-z0-9]{20,}/***/g' \
              -e 's/github_pat_[A-Za-z0-9_]{20,}/***/g' \
              -e 's/sk-ant-[A-Za-z0-9_-]{20,}/***/g' \
              -e 's#x-access-token:[^@]*@#x-access-token:***@#g' \
              || echo "no output captured")
            BODY=$(printf '🔨 **Forge** failed — [full log](%s)\n\n<details><summary>Last output</summary>\n\n```\n%s\n```\n\n</details>\n\nRe-apply the `forge` label to retry.' "$RUN_URL" "$TAIL")
            LABEL="forge:failed"
          fi

          # Best-effort: never fail the job on reporting.
          if [ -n "${COMMENT_ID:-}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" --silent || gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          fi

          # `forge` is also removed here in case we failed before the claim step
          # (e.g. authorization) — otherwise re-labelling can't retrigger.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label "forge" --remove-label "forge:running" --add-label "$LABEL" || true
